<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden | Duschop Tools</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/Kristhal_Logo_Symbol_trans.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a1a2e;
            --accent: #c8956c;
            --accent-light: #e8c4a8;
            --bg: #f5f0eb;
            --text: #2d2d2d;
            --text-light: #6b6b6b;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .logo-img { height: 56px; margin-bottom: 28px; opacity: 0.9; }
        .code {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }
        h1 {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            line-height: 1.2;
        }
        p {
            font-size: 16px;
            color: var(--text-light);
            line-height: 1.7;
            max-width: 460px;
            margin-bottom: 28px;
        }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--accent); }
        .btn-secondary { background: white; color: var(--primary); border: 1px solid #e8e4df; }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <img src="/Kristhal_Logo_Marke_trans.png" alt="Kristhal" class="logo-img">
    <div class="code">Fehler 404</div>
    <h1>Diese Seite gibt es nicht mehr</h1>
    <p>Die Adresse ist veraltet oder vertippt. Kein Problem, alle Berater und Ratgeber finden Sie gesammelt auf der Startseite.</p>
    <div class="actions">
        <a href="/" class="btn btn-primary">Zu den Beratern</a>
        <a href="https://duschop.de" class="btn btn-secondary">Zum Shop duschop.de</a>
    </div>
</body>
</html>
